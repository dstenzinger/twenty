name: Build laptop image

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'deploy/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: build-laptop-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository != 'twentyhq/twenty'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          echo "tag=${branch,,}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/twenty" >> "$GITHUB_OUTPUT"
          version=$(grep -oE "[0-9]+\.[0-9]+\.[0-9]+" packages/twenty-server/src/engine/core-modules/upgrade/constants/twenty-current-version.constant.ts)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
          build-args: APP_VERSION=${{ steps.tag.outputs.version }}
          cache-from: type=gha,scope=${{ steps.tag.outputs.tag }}
          cache-to: type=gha,mode=max,scope=${{ steps.tag.outputs.tag }}
